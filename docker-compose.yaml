# Canonical stack: docker-compose.yaml. This compatibility mirror is checked by tests.
x-build: &build
  context: .
  dockerfile: Dockerfile
  target: runtime
x-database-environment: &database-environment
  POSTGRES_DB: ${POSTGRES_DB:-trader}
  POSTGRES_USER: ${POSTGRES_USER:-trader_admin}
  APP_DATABASE_USER: ${APP_DATABASE_USER:-trader_app}
x-runtime-environment: &runtime-environment
  <<: *database-environment
  NODE_ENV: production
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY to a permanent 64-character hex key}
  LIVE_TRADING_PLATFORM_ENABLED: "false"
services:
  initialize:
    build: *build
    user: "0:0"
    restart: "no"
    command: ["node", "--import", "tsx", "scripts/installation-secrets.ts"]
    volumes:
      - admin-secrets:/secrets/admin
      - app-secrets:/secrets/app
    healthcheck:
      disable: true
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trader_admin}
      POSTGRES_DB: ${POSTGRES_DB:-trader}
      POSTGRES_PASSWORD_FILE: /run/admin-secrets/database-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - admin-secrets:/run/admin-secrets:ro
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  migrate:
    environment: *database-environment
    build: *build
    init: true
    restart: "no"
    command:
      ["node", "--import", "tsx", "scripts/container-entrypoint.ts", "migrate"]
    volumes:
      - admin-secrets:/run/admin-secrets:ro
      - app-secrets:/run/app-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
  web:
    build: *build
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    stop_grace_period: 60s
    environment:
      <<: *runtime-environment
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to your HTTPS domain without a trailing slash}
      PORT: "3000"
      MAIL_MODE: disabled
    volumes:
      - app-secrets:/run/app-secrets:ro
    expose: ["3000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
  worker:
    build: *build
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    stop_grace_period: 60s
    command:
      [
        "node",
        "--use-env-proxy",
        "--import",
        "tsx",
        "scripts/container-entrypoint.ts",
        "worker",
      ]
    environment: *runtime-environment
    volumes:
      - app-secrets:/run/app-secrets:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--import",
          "tsx",
          "scripts/container-health.ts",
          "worker",
        ]
      interval: 30s
      timeout: 8s
      start_period: 60s
      retries: 4
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
  admin-secrets:
  app-secrets:
