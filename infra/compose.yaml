services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: trader
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader"]
      interval: 2s
      retries: 20
volumes:
  postgres:
